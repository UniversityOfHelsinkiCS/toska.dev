name: Deploy toska.dev

on:
 release:
  types: [published]
 workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'renovate[bot]' && github.event.pull_request.user.login != 'renovate[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: toska-dev
          tags: production ${{ github.sha }}
          containerfiles: |
            ./Dockerfile

      - name: Push to version helsinki
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
